services:
  mysql:
    image: mysql:8.4
    container_name: power_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: household_power
      MYSQL_USER: ${MYSQL_USER:-power}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-powerpass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  mongo:
    image: mongo:7
    container_name: power_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
