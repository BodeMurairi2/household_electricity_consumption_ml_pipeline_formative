services:
  mysql:
    image: mysql:8.4
    container_name: power_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: household_power
      MYSQL_USER: ${MYSQL_USER:-power}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-powerpass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: power_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off job: loads the dataset into both databases, then exits
  loader:
    build: .
    container_name: power_loader
    command: sh -c "python -m scripts.load_mysql && python -m scripts.load_mongo"
    environment:
      # Inside the compose network the databases are reached by service name and container port
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-power}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-powerpass}
      MONGO_URI: mongodb://mongo:27017
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  api:
    build: .
    container_name: power_api
    environment:
      # Inside the compose network the databases are reached by service name and container port
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-power}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-powerpass}
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      loader:
        condition: service_completed_successfully

volumes:
  mysql_data:
  mongo_data:
